version: "3.8"

services:
  # 1. Neo4j Graph Database
  neo4j:
    image: neo4j:5
    container_name: occo-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt connection
    volumes:
      - neo4j_data:/data

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: occo-backend
    ports:
      - "8000:8000"
    environment:
      # This tells the backend to talk to the Neo4j container on the internal Docker network
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j

  # 3. Svelte Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: occo-frontend
    ports:
      - "5173:5173" # Standard Vite/SvelteKit development port
      - "3000:3000" # Standard Node adapter port (if used)
    depends_on:
      - backend

volumes:
  neo4j_data:
